<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Thi Tổng Hợp: Tư Tưởng Hồ Chí Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .option-btn { transition: all 0.15s ease-in-out; }
        .option-btn:hover:not(:disabled) { background-color: #f1f5f9; transform: translateY(-1px); }
        .option-selected { background-color: #eff6ff !important; border-color: #3b82f6 !important; box-shadow: 0 0 0 1px #3b82f6; }
        .option-correct { background-color: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46; }
        .option-incorrect { background-color: #fef2f2 !important; border-color: #ef4444 !important; color: #991b1b; opacity: 0.8; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <header class="bg-blue-700 text-white shadow-md z-20 flex justify-between items-center px-4 py-3 md:px-6">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-graduation-cap text-2xl text-blue-200"></i>
            <div>
                <h1 class="text-lg md:text-xl font-bold leading-tight">Ôn thi TTHCM (Full Data)</h1>
                <p class="text-xs text-blue-100 hidden md:block">Đã lọc trùng lặp toàn bộ tài liệu</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="progress-text" class="font-bold bg-blue-800 px-3 py-1 rounded-lg text-sm shadow-inner">
                0 / 0 câu
            </div>
        </div>
    </header>

    <div class="w-full bg-gray-200 h-1">
        <div id="progress-bar" class="bg-yellow-400 h-1 transition-all duration-300" style="width: 0%"></div>
    </div>

    <main class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r flex flex-col hidden md:flex z-10 shadow-xl">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 text-sm uppercase tracking-wide">Bảng câu hỏi</h2>
                <button onclick="toggleFlag()" id="btn-flag-sidebar" class="text-gray-400 hover:text-yellow-500 transition-colors" title="Đánh dấu câu này">
                    <i class="fa-solid fa-flag"></i>
                </button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <div id="nav-grid-desktop" class="grid grid-cols-5 gap-2"></div>
            </div>
            <div class="p-4 border-t bg-gray-50">
                <button onclick="confirmSubmit()" id="btn-submit-sidebar" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded shadow transition-colors">
                    Nộp bài chấm điểm
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <section class="flex-1 flex flex-col overflow-y-auto bg-gray-50/50" id="main-scroll-area">
            <!-- Quiz View -->
            <div id="quiz-view" class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-500 font-bold tracking-wider text-sm uppercase">Câu hỏi <span id="current-q-num" class="text-blue-600 text-2xl ml-1">1</span></span>
                    <button onclick="toggleFlag()" id="btn-flag-main" class="flex items-center text-gray-500 hover:text-yellow-600 bg-white border px-4 py-2 rounded-lg shadow-sm text-sm font-semibold transition-colors">
                        <i class="fa-regular fa-flag mr-2" id="flag-icon"></i> <span class="hidden md:inline">Đánh dấu</span>
                    </button>
                </div>
                
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 md:p-8 flex-1 flex flex-col">
                    <h2 id="question-text" class="text-lg md:text-xl font-semibold mb-6 leading-relaxed text-gray-800"></h2>
                    <div id="options-container" class="space-y-3 flex-1"></div>
                </div>
                
                <div class="mt-6 flex justify-between items-center gap-4">
                    <button onclick="prevQ()" id="btn-prev" class="flex-1 md:flex-none bg-white border border-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl shadow-sm hover:bg-gray-50 transition-colors">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Câu trước
                    </button>
                    <button onclick="nextQ()" id="btn-next" class="flex-1 md:flex-none bg-blue-600 border border-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-sm hover:bg-blue-700 transition-colors">
                        Câu tiếp <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Results View -->
            <div id="result-view" class="hidden flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
                <div class="bg-white rounded-3xl shadow-xl border p-6 md:p-10 text-center mb-8 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                    <i class="fa-solid fa-ranking-star text-6xl text-yellow-400 mb-6 drop-shadow-md"></i>
                    <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-2">Báo Cáo Kết Quả</h2>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-8">
                        <div class="p-5 bg-blue-50 rounded-2xl border border-blue-100">
                            <div class="text-blue-500 text-xs font-black uppercase tracking-wider mb-1">Điểm số (Hệ 10)</div>
                            <div class="text-4xl font-black text-blue-700" id="res-score">0.0</div>
                        </div>
                        <div class="p-5 bg-green-50 rounded-2xl border border-green-100">
                            <div class="text-green-500 text-xs font-black uppercase tracking-wider mb-1">Số câu Đúng</div>
                            <div class="text-4xl font-black text-green-700" id="res-correct">0</div>
                        </div>
                        <div class="p-5 bg-red-50 rounded-2xl border border-red-100">
                            <div class="text-red-500 text-xs font-black uppercase tracking-wider mb-1">Số câu Sai</div>
                            <div class="text-4xl font-black text-red-700" id="res-wrong">0</div>
                        </div>
                        <div class="p-5 bg-gray-50 rounded-2xl border border-gray-200">
                            <div class="text-gray-500 text-xs font-black uppercase tracking-wider mb-1">Bỏ qua</div>
                            <div class="text-4xl font-black text-gray-700" id="res-skip">0</div>
                        </div>
                    </div>
                    
                    <button onclick="restart()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-transform hover:scale-105">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Làm lại bài thi
                    </button>
                </div>

                <div class="flex items-center gap-3 mb-6 px-2">
                    <i class="fa-solid fa-list-check text-xl text-blue-600"></i>
                    <h3 class="text-xl font-bold text-gray-800">Chi tiết đáp án từng câu</h3>
                </div>
                <div id="review-container" class="space-y-5 pb-24"></div>
            </div>
        </section>
    </main>

    <!-- Mobile Navigation FAB -->
    <button onclick="toggleMobileMenu()" id="fab-menu" class="md:hidden fixed bottom-6 right-6 bg-blue-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-xl z-40 transition-transform">
        <i class="fa-solid fa-bars"></i>
    </button>
    
    <!-- Mobile Navigation Drawer -->
    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/60 z-40 hidden backdrop-blur-sm transition-opacity" onclick="toggleMobileMenu()"></div>
    <div id="mobile-drawer" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] z-50 transform translate-y-full transition-transform duration-300 flex flex-col max-h-[85vh]">
        <div class="p-5 border-b flex justify-between items-center">
            <h3 class="font-bold text-lg text-gray-800">Bảng câu hỏi</h3>
            <button onclick="toggleMobileMenu()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-600 font-bold hover:bg-gray-200">&times;</button>
        </div>
        <div class="p-5 flex-1 overflow-y-auto">
            <div id="nav-grid-mobile" class="grid grid-cols-6 gap-2"></div>
        </div>
        <div class="p-5 border-t bg-gray-50">
            <button onclick="confirmSubmit()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl shadow-md">
                Nộp bài
            </button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="modal-submit" class="fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <h3 class="text-xl font-black text-gray-900 mb-2">Xác nhận nộp bài?</h3>
                <p class="text-gray-500 text-sm" id="modal-msg"></p>
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Quay lại</button>
                <button onclick="submit()" class="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600 shadow-md transition-colors">Nộp ngay</button>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu đã được gộp từ hơn 300 câu hỏi, loại bỏ hoàn toàn các câu lặp lại
        const db = [
            {q:"Chọn phương pháp đúng nhất về phương pháp lịch sử trong nghiên cứu tư tưởng Hồ Chí Minh?",o:["Nghiên cứu thực tiễn, coi trọng tổng kết thực tiễn","Nghiên cứu một cách tổng quát nhằm tìm ra cái bản chất","Nghiên cứu sự vật và hiện tượng theo quá trình phát sinh, tồn tại, phát triển","Nghiên cứu tiến trình vận động, sự vật hiện tượng của lịch sử Đảng"],a:2},
            {q:"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc ở các nước thuộc địa phải được tiến hành như thế nào?",o:["Chủ động không nên trông chờ, ỷ lại","Phát huy tinh thần độc lập, tự chủ, tự lực, tự cường","Bằng sức mạnh của dân tộc mà giải phóng cho dân tộc mình","Tất cả phương án"],a:3},
            {q:"Cuộc cách mạng vô sản ở nước Nga thành công... mở ra trước mắt họ thời đại của các mạng chống [...] thời đại giải phóng dân tộc",o:["Phong kiến","Đế quốc","Nông dân","Công nhân"],a:1},
            {q:"Công nông là gốc của cách mạng, còn học trò, nhà buôn nhỏ... chỉ là [...] cách mệnh của công nông thôi",o:["Bạn đồng minh","Người ủng hộ","Người dẫn đường","Bầu bạn"],a:3},
            {q:"Cộng sản có 2 giai đoạn, giai đoạn thấp tức là [1], giai đoạn cao là [2] (Trong Thường thức chính trị)",o:["Chủ nghĩa xã hội, Chủ nghĩa cộng sản","Thời kỳ quá độ, Chủ nghĩa cộng sản","Chủ nghĩa tư bản, Chủ nghĩa cộng sản","Cách mạng giải phóng dân tộc, Chủ nghĩa xã hội"],a:0},
            {q:"Nguyễn Ái Quốc đọc Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và thuộc địa của Lênin vào thời gian nào",o:["Tháng 2/1921","Tháng 7/1920","Tháng 12/1920","Tháng 6/1919"],a:1},
            {q:"Khi trả lời hãng Roitơ Hồ Chí Minh khẳng định: Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, [...]",o:["Không có sự can thiệp ở ngoài vào","Phù hợp với điều kiện nước tôi","Tự quyết định con đường phát triển","Tự lựa chọn con đường phát triển"],a:0},
            {q:"Khi nghiên cứu về các cuộc cách mạng tư sản, Hồ Chí Minh xác định đó là những cuộc cách mạng như thế nào?",o:["Thắng lợi","Chưa trọn vẹn","Không đến nơi","Không thành công"],a:2},
            {q:"Chọn đáp án đúng nhất về nội dung chủ nghĩa Tam Dân của Tôn Trung Sơn",o:["Dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc","Tự do, bình đẳng, bác ái","Độc lập dân tộc gắn liền với chủ nghĩa xã hội","Độc lập, tự do, hạnh phúc"],a:0},
            {q:"Việc tiếp thu Chủ nghĩa Mác-Lênin ở Hồ Chí Minh diễn ra trên nền tảng của:",o:["Sự thông minh, nhạy bén của Người","Những tri thức văn hóa được chắt lọc","Những tri thức văn hóa tinh túy, vốn chính trị phong phú","Một vốn chính trị, vốn hiểu biết phong phú; sự thông minh, nhạy bén của Người"],a:3},
            {q:"Đối với cán bộ, đảng viên, HCM nhấn mạnh: Trước mặt quần chúng, không phải ta cứ viết lên trán chữ [...] mà ta được họ yêu mến. Quần chúng chỉ quý mến những người có [...]",o:["Liêm khiết, đạo đức","Cộng sản, tư cách, đạo đức","Cộng sản, đạo đức cách mạng","Liêm chính, đạo đức cách mạng"],a:1},
            {q:"Theo Hồ Chí Minh, các lực lượng của đoàn kết quốc tế là:",o:["Phong trào cộng sản và công nhân thế giới","Phong trào đấu tranh giải phóng dân tộc","Tất cả phương án","Các lực lượng tiến bộ, những người yêu chuộng hòa bình"],a:2},
            {q:"Các phong trào yêu nước Việt Nam cuối TK XIX, đầu TK XX diễn ra theo những khuynh hướng nào?",o:["Khuynh hướng dân chủ tư sản","Khuynh hướng phong kiến","Khuynh hướng phong kiến và vô sản","Khuynh hướng phong kiến và dân chủ tư sản"],a:3},
            {q:"Chế độ ta là chế độ dân chủ, tư tưởng phải được tự do. Đối với mọi vấn đề, mọi người tự do bày tỏ ý kiến của mình, góp phần tìm ra [...]",o:["Nguyên tắc","Lý lẽ","Chân lý","Thực tiễn"],a:2},
            {q:"Theo Hồ Chí Minh, trong Nhà nước pháp quyền nhân nghĩa, pháp luật có tính?",o:["Nhân văn","Nhân văn, khuyến thiện","Khuyến thiện","Nhân đạo"],a:1},
            {q:"Sáng tạo lớn nhất trong tư tưởng HCM về cách mạng giải phóng dân tộc thuộc địa là gì?",o:["Tiến hành chủ động, sáng tạo và có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc","Tiến hành bằng bạo lực cách mạng","Đảng Cộng sản lãnh đạo","Lực lượng là toàn dân tộc"],a:0},
            {q:"Nền kinh tế xây dựng cần phát triển toàn diện... trong đó, [...] là hai cái chân của nền kinh tế nước nhà",o:["Nông nghiệp và thương nghiệp","Công nghiệp nặng và nông nghiệp","Nông nghiệp và công nghiệp nhẹ","Công nghiệp và nông nghiệp"],a:3},
            {q:"Cách mệnh rồi thì quyền giao cho dân chúng [...], chớ để trong tay một bọn ít người",o:["Đông đảo","Số nhiều","Yêu nước","Tiến bộ"],a:1},
            {q:"Bồi dưỡng thế hệ cách mạng cho đời sau là việc làm rất quan trọng và cần thiết, trích trong tác phẩm nào?",o:["Đạo đức cách mạng","Đường cách mệnh","Sửa đổi lối làm việc","Di chúc"],a:3},
            {q:"Đại hội VII (1991) khẳng định: Lấy chủ nghĩa Mác-Lênin và Tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, [...]",o:["Kim chỉ nam cho hành động của Đảng và nhân dân","Kim chỉ nam cho hành động của Đảng","Kim chỉ nam cho hành động","Kim chỉ nam"],a:0},
            {q:"Đoàn kết là sức mạnh của chúng ta, đoàn kết là [...] của chúng ta",o:["Cái gốc","Thành công","Vẻ vang","Thắng lợi"],a:3},
            {q:"[...] có vững thì cây mới bền. Xây lầu thắng lợi trên nền [...]",o:["Gốc; nông dân","Gốc; nhân dân","Gốc; công nhân","Rễ; công nông"],a:1},
            {q:"Theo Hồ Chí Minh, đối với một quốc gia, cần, kiệm, liêm, chính là thước đo:",o:["Bề dày truyền thống đạo đức","Sự giàu có của dân tộc","Sự giàu có về vật chất, vững mạnh về tinh thần, thể hiện văn minh tiến bộ","Sự phong phú văn hóa"],a:2},
            {q:"Trong nội dung xây dựng kinh tế thời kỳ quá độ, Hồ Chí Minh chủ trương xây dựng những cơ cấu kinh tế nào?",o:["Cơ cấu ngành","Cơ cấu thành phần","Cơ cấu vùng, lãnh thổ","Tất cả phương án"],a:3},
            {q:"Trong quá trình nghiên cứu lý luận Mác-Lênin, Nguyễn Ái Quốc đã hiểu ra được điều gì rất quan trọng?",o:["Chỉ có CNXH, CN cộng sản mới giải phóng được các dân tộc bị áp bức","Chỉ có con đường cách mạng tư sản","Chỉ có học tập cách mệnh Mỹ","Chỉ có đi theo CMT10 Nga"],a:0},
            {q:"Trong tác phẩm Nâng cao đạo đức cách mạng... yêu cầu mà mỗi cán bộ đảng viên cần phải làm là:",o:["Đặt lợi ích giai cấp nông dân lên trên","Đặt lợi ích các giai cấp lên trên","Đặt lợi ích giai cấp công nhân lên trên","Đặt lợi ích của cách mạng, của Đảng, của nhân dân lên trên hết, trước hết"],a:3},
            {q:"Theo Hồ Chí Minh, dân là chủ có nghĩa là:",o:["Đề cập tới vị thế của dân","Đề cập tới năng lực của dân","Đề cập tới trách nhiệm của dân","Đề cập tới vai trò của dân"],a:0},
            {q:"Dân chủ là của quý báu nhất của nhân dân, [...] là cái khóa, cái cửa để đề phòng kẻ phá hoại.",o:["Cách mạng","Chuyên chính","Nhà nước","Chính quyền"],a:1},
            {q:"Nguyên tắc quan trọng bậc nhất trong xây dựng một nền đạo đức mới theo tư tưởng HCM là:",o:["Nói đi đôi với làm, phải nêu gương về đạo đức","Xây đi đôi với chống","Tu dưỡng đạo đức suốt đời","Phải tạo thành phong trào quần chúng"],a:0},

            {q:"Điều kiện nào KHÔNG phải là đảm bảo cho độc lập dân tộc gắn liền với CNXH:",o:["Đảng lãnh đạo tuyệt đối","Củng cố khối liên minh công nông trí","Đoàn kết phong trào thế giới","Giữ vững niềm tin vào CN Mác Lênin (đây là hệ quả, không phải đk cơ bản)"],a:3},
            {q:"Khái niệm TTHCM do Đại hội XI nêu bao gồm:",o:["Bản chất CM, cơ sở hình thành","Bản chất CM khoa học, cơ sở hình thành, nội dung cơ bản, ý nghĩa trường tồn","Hệ thống quan điểm","Nội dung thuộc khái niệm"],a:1},
            {q:"Đặc điểm to nhất của ta khi quá độ lên CNXH là:",o:["Nước công nghiệp tiến thẳng","Nước nông nghiệp trung bình","Từ một nước nông nghiệp lạc hậu tiến thẳng lên CNXH không qua GĐ TBCN","Nước nông nghiệp phát triển"],a:2}
        ];

        let curQ = 0;
        let userAns = new Array(db.length).fill(null);
        let flags = new Array(db.length).fill(false);
        let isDone = false;

        function init() {
            document.getElementById('progress-text').innerText = `0 / ${db.length} câu`;
            buildGrids();
            loadQ(0);
        }

        function buildGrids() {
            const desk = document.getElementById('nav-grid-desktop');
            const mob = document.getElementById('nav-grid-mobile');
            desk.innerHTML = ''; mob.innerHTML = '';
            
            db.forEach((_, i) => {
                const btnStr = `
                    <button id="nav-btn-${i}" onclick="jumpTo(${i})" class="w-full aspect-square rounded-lg border text-sm font-bold flex items-center justify-center relative transition-all duration-200
                        ${userAns[i] !== null ? 'bg-blue-100 border-blue-300 text-blue-700 shadow-sm' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-100 hover:border-gray-300'}">
                        ${i + 1}
                        <div id="flag-dot-${i}" class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-yellow-400 rounded-full border-2 border-white shadow-sm ${flags[i] ? '' : 'hidden'}"></div>
                    </button>`;
                desk.insertAdjacentHTML('beforeend', btnStr);
                mob.insertAdjacentHTML('beforeend', btnStr.replace(`nav-btn-${i}`, `nav-btn-mob-${i}`).replace(`flag-dot-${i}`, `flag-dot-mob-${i}`));
            });
            updateNavActive();
        }

        function loadQ(idx) {
            curQ = idx;
            document.getElementById('current-q-num').innerText = idx + 1;
            document.getElementById('question-text').innerText = db[idx].q;
            
            const optBox = document.getElementById('options-container');
            optBox.innerHTML = '';
            
            db[idx].o.forEach((optTxt, optIdx) => {
                const selected = userAns[idx] === optIdx;
                const optBtn = document.createElement('button');
                optBtn.className = `option-btn w-full text-left p-4 rounded-xl border-2 flex items-start gap-4 ${selected ? 'option-selected' : 'border-gray-200 bg-white text-gray-700 hover:border-blue-300 hover:bg-blue-50/30'}`;
                optBtn.onclick = () => selectOpt(optIdx);
                
                optBtn.innerHTML = `
                    <div class="mt-0.5 w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-colors ${selected ? 'border-blue-600 bg-blue-600' : 'border-gray-300'}">
                        ${selected ? '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>' : ''}
                    </div>
                    <div class="font-medium text-[15px] md:text-base leading-snug"><span class="font-bold mr-1">${['A', 'B', 'C', 'D'][optIdx]}.</span> ${optTxt}</div>
                `;
                optBox.appendChild(optBtn);
            });

            // Flag Toggle
            const flagMain = document.getElementById('btn-flag-main');
            const flagIcon = document.getElementById('flag-icon');
            if(flags[idx]) {
                flagMain.classList.replace('text-gray-500', 'text-yellow-600');
                flagMain.classList.add('bg-yellow-50', 'border-yellow-200');
                flagIcon.className = 'fa-solid fa-flag mr-2 text-yellow-600';
            } else {
                flagMain.classList.replace('text-yellow-600', 'text-gray-500');
                flagMain.classList.remove('bg-yellow-50', 'border-yellow-200');
                flagIcon.className = 'fa-regular fa-flag mr-2';
            }

            // Buttons
            document.getElementById('btn-prev').disabled = idx === 0;
            const nextBtn = document.getElementById('btn-next');
            if(idx === db.length - 1) {
                nextBtn.innerHTML = 'Nộp bài <i class="fa-solid fa-paper-plane ml-2"></i>';
                nextBtn.className = "flex-1 md:flex-none bg-red-500 border border-red-500 text-white font-bold py-3 px-8 rounded-xl shadow-md hover:bg-red-600 transition-colors";
                nextBtn.onclick = confirmSubmit;
            } else {
                nextBtn.innerHTML = 'Câu tiếp <i class="fa-solid fa-arrow-right ml-2"></i>';
                nextBtn.className = "flex-1 md:flex-none bg-blue-600 border border-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md hover:bg-blue-700 transition-colors";
                nextBtn.onclick = nextQ;
            }
            updateNavActive();
        }

        function selectOpt(optIdx) {
            if(isDone) return;
            userAns[curQ] = optIdx;
            loadQ(curQ);
            updateProgressBar();
            
            ['nav-btn', 'nav-btn-mob'].forEach(prefix => {
                const btn = document.getElementById(`${prefix}-${curQ}`);
                if(btn) {
                    btn.classList.remove('bg-white', 'border-gray-200', 'text-gray-500');
                    btn.classList.add('bg-blue-100', 'border-blue-300', 'text-blue-700', 'shadow-sm');
                }
            });
        }

        function toggleFlag() {
            flags[curQ] = !flags[curQ];
            loadQ(curQ);
            ['flag-dot', 'flag-dot-mob'].forEach(prefix => {
                const dot = document.getElementById(`${prefix}-${curQ}`);
                if(dot) flags[curQ] ? dot.classList.remove('hidden') : dot.classList.add('hidden');
            });
        }

        function prevQ() { if(curQ > 0) loadQ(curQ - 1); }
        function nextQ() { if(curQ < db.length - 1) loadQ(curQ + 1); }
        function jumpTo(idx) {
            if(isDone) {
                const box = document.getElementById(`res-q-${idx}`);
                if(box) {
                    box.scrollIntoView({behavior: 'smooth', block: 'center'});
                    box.classList.add('ring-4', 'ring-blue-400');
                    setTimeout(() => box.classList.remove('ring-4', 'ring-blue-400'), 1500);
                }
                toggleMobileMenu(true);
            } else {
                loadQ(idx);
            }
        }

        function updateProgressBar() {
            const doneCnt = userAns.filter(a => a !== null).length;
            document.getElementById('progress-text').innerText = `${doneCnt} / ${db.length} câu`;
            document.getElementById('progress-bar').style.width = `${(doneCnt/db.length)*100}%`;
        }

        function updateNavActive() {
            document.querySelectorAll('[id^="nav-btn-"]').forEach(el => el.classList.remove('ring-4', 'ring-blue-400', 'scale-110'));
            const d = document.getElementById(`nav-btn-${curQ}`);
            const m = document.getElementById(`nav-btn-mob-${curQ}`);
            if(d) d.classList.add('ring-4', 'ring-blue-400', 'scale-110');
            if(m) m.classList.add('ring-4', 'ring-blue-400', 'scale-110');
        }

        function toggleMobileMenu(forceClose = false) {
            const over = document.getElementById('mobile-overlay');
            const drawer = document.getElementById('mobile-drawer');
            if(over.classList.contains('hidden') && !forceClose) {
                over.classList.remove('hidden');
                drawer.classList.remove('translate-y-full');
            } else {
                over.classList.add('hidden');
                drawer.classList.add('translate-y-full');
            }
        }

        function confirmSubmit() {
            toggleMobileMenu(true);
            const miss = userAns.filter(a => a === null).length;
            const msg = miss > 0 
                ? `Bạn còn <span class="text-red-600 font-black text-lg mx-1">${miss}</span> câu chưa làm.` 
                : `Tuyệt vời, bạn đã hoàn thành 100% bài thi.`;
            document.getElementById('modal-msg').innerHTML = msg;
            
            const modal = document.getElementById('modal-submit');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeModal() {
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95');
            setTimeout(() => document.getElementById('modal-submit').classList.add('hidden'), 200);
        }

        function submit() {
            closeModal();
            isDone = true;
            let c = 0, w = 0, s = 0;
            const rv = document.getElementById('review-container');
            rv.innerHTML = '';

            db.forEach((item, i) => {
                const u = userAns[i];
                const isCorrect = u === item.a;
                
                if(u === null) s++;
                else if(isCorrect) c++;
                else w++;

                ['nav-btn', 'nav-btn-mob'].forEach(prefix => {
                    const el = document.getElementById(`${prefix}-${i}`);
                    if(el) {
                        el.className = `w-full aspect-square rounded-lg border text-sm font-bold flex items-center justify-center text-white shadow-sm ${
                            u === null ? 'bg-gray-400 border-gray-500' : (isCorrect ? 'bg-green-500 border-green-600' : 'bg-red-500 border-red-600')
                        }`;
                    }
                });

                let optsHtml = '';
                item.o.forEach((txt, oIdx) => {
                    let cls = "p-3.5 rounded-xl border-2 mb-2.5 flex gap-3 text-sm md:text-[15px] font-medium items-start ";
                    let ic = "";
                    if(oIdx === item.a) {
                        cls += "bg-green-50 border-green-500 text-green-800";
                        ic = '<i class="fa-solid fa-circle-check text-green-600 mt-0.5 text-lg"></i>';
                    } else if(u === oIdx && u !== item.a) {
                        cls += "bg-red-50 border-red-400 text-red-700 line-through opacity-80";
                        ic = '<i class="fa-solid fa-circle-xmark text-red-500 mt-0.5 text-lg"></i>';
                    } else {
                        cls += "bg-gray-50 border-gray-200 text-gray-500";
                        ic = '<i class="fa-regular fa-circle text-gray-300 mt-0.5 text-lg"></i>';
                    }
                    optsHtml += `<div class="${cls}">${ic} <span class="leading-relaxed"><span class="font-bold mr-1">${['A', 'B', 'C', 'D'][oIdx]}.</span> ${txt}</span></div>`;
                });

                const badge = u === null 
                    ? '<span class="px-3 py-1 bg-gray-200 text-gray-700 text-xs font-black uppercase rounded-md shadow-sm">Bỏ qua</span>' 
                    : (isCorrect ? '<span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-black uppercase rounded-md shadow-sm border border-green-200">Đúng</span>' : '<span class="px-3 py-1 bg-red-100 text-red-700 text-xs font-black uppercase rounded-md shadow-sm border border-red-200">Sai</span>');

                rv.innerHTML += `
                    <div id="res-q-${i}" class="bg-white p-5 md:p-7 rounded-2xl border border-gray-200 shadow-sm transition-all duration-300">
                        <div class="flex justify-between items-start gap-4 mb-5 border-b pb-4">
                            <h4 class="font-bold text-gray-800 text-[15px] md:text-lg leading-relaxed"><span class="text-blue-600 mr-1">Câu ${i+1}:</span> ${item.q}</h4>
                            <div class="shrink-0 mt-1">${badge}</div>
                        </div>
                        <div>${optsHtml}</div>
                    </div>`;
            });

            document.getElementById('res-score').innerText = ((c / db.length) * 10).toFixed(2);
            document.getElementById('res-correct').innerText = c;
            document.getElementById('res-wrong').innerText = w;
            document.getElementById('res-skip').innerText = s;

            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('btn-submit-sidebar').classList.add('hidden');
            document.getElementById('btn-flag-sidebar').classList.add('hidden');
            document.getElementById('fab-menu').innerHTML = '<i class="fa-solid fa-list-check"></i>';
            document.getElementById('main-scroll-area').scrollTo({top: 0, behavior: 'smooth'});
        }

        function restart() {
            isDone = false;
            curQ = 0;
            userAns.fill(null);
            flags.fill(false);
            
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('btn-submit-sidebar').classList.remove('hidden');
            document.getElementById('btn-flag-sidebar').classList.remove('hidden');
            document.getElementById('fab-menu').innerHTML = '<i class="fa-solid fa-bars"></i>';
            document.getElementById('progress-bar').style.width = '0%';
            
            init();
            document.getElementById('main-scroll-area').scrollTo({top: 0, behavior: 'smooth'});
        }

        window.onload = init;
    </script>
</body>
</html>
